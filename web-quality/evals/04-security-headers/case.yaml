schema_version: "1.0"
name: security-headers
description: A header check on a URL reaches the security skill (or the audit) and reads the real headers with the plugin's script. Needs network.
tags: [routing, security]
execution:
  prompt: "Check the security headers of https://react-vite-boilerplate-9od.pages.dev/ and tell me what is missing."
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Skill, Bash, Read]
graders:
  - type: tool_used
    name: runs-a-web-quality-skill
    tool: Skill
    input_match: "security|audit"
    arm: both
  - type: tool_used
    name: reads-the-headers
    tool: Bash
    input_match: 'check-headers\.mjs'
    arm: both
