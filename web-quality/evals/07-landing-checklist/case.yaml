schema_version: "1.0"
name: landing-checklist
description: A launch check of a public landing page reaches the audit skill and asks PageSpeed Insights through the plugin's script. Needs network; a 429 from the API's shared quota still counts as the script run.
tags: [routing, audit]
execution:
  prompt: "We launch our landing page https://react-vite-boilerplate-app.netlify.app/ tomorrow. Check it with axe, Lighthouse and PageSpeed Insights and tell me what blocks the launch."
  max_turns: 10
  timeout_seconds: 420
  allowed_tools: [Skill, Bash, Read]
graders:
  - type: tool_used
    name: runs-audit
    tool: Skill
    input_match: "audit"
    arm: both
  - type: tool_used
    name: asks-pagespeed
    tool: Bash
    input_match: 'pagespeed\.mjs'
    arm: both
