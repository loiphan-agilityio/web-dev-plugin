schema_version: "1.0"
name: audit-natural
description: A plain-words quality question about a built app reaches the audit skill.
tags: [routing, audit]
context:
  scaffold_script: setup.sh
execution:
  prompt: "Is this web app ready for production? Check how fast it loads, its accessibility and its SEO. The build is in dist/."
  max_turns: 10
  timeout_seconds: 420
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
graders:
  - type: tool_used
    name: runs-audit
    tool: Skill
    input_match: "audit"
    arm: both
