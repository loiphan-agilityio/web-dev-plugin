schema_version: "1.0"
name: setup-asks-for-kind
description: A setup request that does not say landing page or web app asks that one question, not about authentication, and creates nothing.
tags: [routing, edge]
execution:
  prompt: "/web-dev:develop Scaffold a new project called billing-portal."
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Agent, Bash, Read, Glob, Grep, Write, Edit]
graders:
  - type: tool_used
    name: runs-project-setup
    tool: Skill
    input_match: "project-setup"
    arm: both
  - type: tool_used
    name: creates-nothing
    tool: Bash
    input_match: "create-project\\.sh"
    min: 0
    max: 0
    arm: both
  - type: file_exists
    name: no-project
    path: "**/pnpm-workspace.yaml"
    exists: false
  - type: llm
    name: asks-about-kind
    criteria: |
      - The answer asks one question with two choices, a landing page or a web app with authentication, and says what each gives.
      - It does not ask a separate question about authentication.
      - It does not pick one on its own, and does not claim a project was created.
