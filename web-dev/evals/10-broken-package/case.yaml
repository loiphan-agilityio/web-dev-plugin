schema_version: "1.0"
name: broken-package
description: detect-project fails on a package.json that is not valid JSON; develop reports it and changes nothing.
tags: [routing, failure]
context:
  scaffold_script: setup.sh
execution:
  prompt: "/web-dev:develop Add a settings page with a theme switch."
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Skill, Agent, Bash, Read, Glob, Grep, Write, Edit]
graders:
  - type: tool_used
    name: runs-detection
    tool: Bash
    input_match: "detect-project\\.mjs"
    arm: both
  - type: regex
    name: reports-the-broken-file
    target: last_message
    pattern: "package\\.json[^\\n]*(not valid|invalid|parse|syntax)|(not valid|invalid|parse|syntax)[^\\n]*package\\.json"
    flags: i
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: no-write
    tool: Write
    min: 0
    max: 0
    arm: both
