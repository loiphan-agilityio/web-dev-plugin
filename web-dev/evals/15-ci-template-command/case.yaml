schema_version: "1.0"
name: ci-template-command
description: A CI request in a template app goes to ci-setup (workflow C), which writes the GitHub workflow with its script and scaffolds nothing.
tags: [routing, workflow-c]
context:
  scaffold_script: setup.sh
execution:
  prompt: "/web-dev:develop Set up CI on GitHub that runs our unit tests on every push."
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Skill, Agent, Bash, Read, Glob, Grep, Write, Edit]
graders:
  - type: tool_used
    name: runs-ci-setup
    tool: Skill
    input_match: "ci-setup"
    arm: both
  - type: tool_used
    name: writes-with-the-script
    tool: Bash
    input_match: "setup-ci\\.sh"
    arm: both
  - type: file_exists
    name: workflow-written
    path: ".github/workflows/unit-tests.yml"
  - type: tool_used
    name: no-new-scaffold
    tool: Bash
    input_match: "scaffold\\.sh"
    min: 0
    max: 0
    arm: both
