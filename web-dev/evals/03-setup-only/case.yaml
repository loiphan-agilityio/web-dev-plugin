schema_version: "1.0"
name: setup-only
description: A new project with no features goes to project-setup alone, without a plan.
tags: [routing]
execution:
  prompt: "/web-dev:develop Scaffold a new web app called billing-portal, without authentication."
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Skill, Agent, Bash, Read, Glob, Grep, Write, Edit]
graders:
  - type: tool_used
    name: runs-project-setup
    tool: Skill
    input_match: "project-setup"
    arm: both
  - type: tool_used
    name: scaffolds
    tool: Bash
    input_match: "create-project\\.sh .*--no-auth"
    arm: both
  - type: file_exists
    name: no-plan
    path: "**/docs/plan.md"
    exists: false
