schema_version: "1.0"
name: setup-other-stack
description: A setup request in a React project on another stack does not scaffold over it or add the template's libraries.
tags: [routing, existing-project, edge]
context:
  scaffold_script: setup.sh
execution:
  prompt: "/web-dev:develop Set this project up with the web-dev stack: Effect, shadcn/ui, Storybook and the git hooks."
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Agent, Bash, Read, Glob, Grep, Write, Edit]
graders:
  - type: tool_used
    name: no-scaffold
    tool: Bash
    input_match: "create-project\\.sh"
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: no-new-libraries
    tool: Bash
    input_match: "(add|install) .*(effect|shadcn|storybook|husky)"
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
    arm: both
  - type: llm
    name: explains-and-offers
    criteria: |
      - The answer says this version does not add the template's stack or tooling to an existing project.
      - It offers a new app from the template in a subfolder as the alternative, leaving the current project as it is.
      - It does not claim to have set anything up.
