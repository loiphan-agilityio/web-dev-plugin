schema_version: "1.0"
name: review-mr-template
description: A request to review a merge request in an app from the boilerplate loads review-mr, which submits nothing in the turn that drafts; the fixture has no GitLab or GitHub remote, so it stops at its preconditions and explains the draft, edit, post flow.
tags: [routing]
context:
  scaffold_script: setup.sh
execution:
  prompt: "review mr!12"
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
graders:
  - type: tool_used
    name: runs-review-mr
    tool: Skill
    input_match: "review-mr"
    arm: with-only
  - type: tool_used
    name: no-pr-skill
    tool: Skill
    input_match: "web-dev:pr\\b"
    min: 0
    max: 0
    arm: with-only
  - type: tool_used
    name: submits-nothing
    tool: Bash
    input_match: "event=|--approve|--request-changes|--comment|bulk_publish|reviews/[0-9]+/events"
    min: 0
    max: 0
    arm: both
  - type: llm
    name: explains-the-flow
    criteria: |
      - The answer does not claim a review or a comment was posted or submitted.
      - It names what stops it here (no GitLab or GitHub remote, or the host CLI not signed in, or no merge request !12).
      - It says the comments would be left as a pending review only the user sees, for the user to edit or delete before asking for them to be posted.
      - It does not present an invented review of code it could not read (no findings for a merge request it never fetched).
