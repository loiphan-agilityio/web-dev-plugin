schema_version: "1.0"
name: app-other-folder
description: A whole app asked for in a folder that holds other files but no package.json goes into a new subfolder; the files stay as they are.
tags: [routing, workflow-a, edge]
context:
  scaffold_script: setup.sh
execution:
  prompt: "/web-dev:develop Build an expense tracker for our team: expenses with amount, category and date, a monthly summary, and approval by a manager."
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Skill, Agent, Bash, Read, Glob, Grep, Write, Edit]
graders:
  - type: regex
    name: plan-in-a-subfolder
    target: files
    pattern: "(^|\\n)[a-z0-9-]+/docs/plan\\.md"
  - type: file_exists
    name: no-plan-at-the-root
    path: "docs/plan.md"
    exists: false
  - type: tool_used
    name: notes-untouched
    tool: Edit
    input_match: "notes\\.md"
    min: 0
    max: 0
    arm: both
