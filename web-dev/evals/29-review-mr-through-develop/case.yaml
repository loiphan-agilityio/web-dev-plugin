schema_version: "1.0"
name: review-mr-through-develop
description: A security review request sent through develop in an app from the boilerplate is routed to review-mr, not to pr and not to "not yet"; nothing is submitted, pushed or opened.
tags: [routing, workflow-c]
context:
  scaffold_script: setup.sh
execution:
  prompt: "/web-dev:develop Review MR !12 for security issues and leave comments I can check first."
  max_turns: 10
  timeout_seconds: 450
  allowed_tools: [Skill, Agent, Bash, Read, Glob, Grep]
graders:
  - type: tool_used
    name: runs-review-mr
    tool: Skill
    input_match: "review-mr"
    arm: with-only
  - type: tool_used
    name: nothing-goes-out
    tool: Bash
    input_match: "event=|--approve|--request-changes|bulk_publish|git push|gh pr create|glab mr create"
    min: 0
    max: 0
    arm: both
  - type: llm
    name: routes-to-review
    criteria: |
      - The answer does not say reviews are not covered by this version.
      - It does not claim anything was posted, pushed or opened.
      - It says what blocks the review here (no GitLab remote or glab, or no merge request !12) and that the review, security included, would be drafted as comments for the user to check before posting.
