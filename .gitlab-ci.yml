# Checks the web-dev plugin:
# - plugin-manifest: the plugin and marketplace manifests are valid.
# - web-dev: the template, and the todos feature the skills quote, pass every gate on a
#   fresh scaffold.
# - skills-spec: every skill passes skills-ref, the Agent Skills specification's validator, and
#   every eval case.yaml parses.
# - audit: no known vulnerability in the template's dependencies, apart from the ones listed with
#   a reason under auditConfig in its pnpm-workspace.yaml.
# - companions (schedules only): the pinned companion skills still install, and shadcn is pinned.
# - evals-routing, evals-e2e (manual jobs on release tags web-dev--v*, when the ANTHROPIC_API_KEY
#   variable is set): the model evals. They cost API credits, so nothing starts them: they run only
#   when the maintainer presses them, after every free job passed, each capped by --max-cost-usd.
# Runs on merge requests and branch pushes that touch the plugin, on release tags, and on pipeline
# schedules (set a weekly one in Build > Pipeline schedules) to catch a dependency release that
# breaks the template; schedules run only the free jobs.
workflow:
  rules:
    # Schedules first: a scheduled pipeline also has CI_COMMIT_BRANCH, and must not be dropped
    # by the open-merge-request rule below.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^web-dev--v/

default:
  image: node:24

.plugin-changes:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes:
        - web-dev/**/*
        - tools/**/*
        - .claude-plugin/**/*
        - .gitlab-ci.yml

plugin-manifest:
  extends: .plugin-changes
  variables:
    # Pinned like everything else; validation needs no login.
    CLAUDE_CODE: '@anthropic-ai/claude-code@2.1.304'
  script:
    - npx -y "$CLAUDE_CODE" plugin validate --strict web-dev/.claude-plugin/plugin.json
    - npx -y "$CLAUDE_CODE" plugin validate --strict .

web-dev:
  extends: .plugin-changes
  before_script:
    # pnpm 11 comes from the template's packageManager field.
    - corepack enable
  script:
    - bash tools/verify-template.sh

skills-spec:
  extends: .plugin-changes
  image: python:3.13-slim
  script:
    # The Agent Skills reference validator, pinned like every other tool here.
    - pip install --quiet skills-ref==0.1.1 pyyaml==6.0.3
    - bash tools/validate-skills.sh

audit:
  extends: .plugin-changes
  before_script:
    - corepack enable
  script:
    # Reads the lockfile only; a new advisory fails the job until it is fixed or explicitly ignored.
    - cd web-dev/skills/project-setup/assets/app-template
    - pnpm audit

companions:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    # Upstream repos can move or delete a pinned path; the script fails on a missing companion, a
    # missing skills-lock.json or an unpinned shadcn@latest.
    - bash web-dev/skills/project-setup/scripts/scaffold.sh /tmp/app companions-app
    - cd /tmp/app
    - bash "$CI_PROJECT_DIR/web-dev/skills/project-setup/scripts/install-companions.sh"
    - test "$(find .claude/skills -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 8

# The model evals run only when the maintainer asks: manual jobs on a release tag, after the free
# jobs passed (needs). Nothing starts them automatically, and a tag pipeline passes without them.
.evals:
  rules:
    - if: $CI_COMMIT_TAG =~ /^web-dev--v/ && $ANTHROPIC_API_KEY
      when: manual
      # Without this, a manual job from rules blocks the tag pipeline until someone presses it.
      allow_failure: true
  needs: [plugin-manifest, web-dev, skills-spec]
  variables:
    CLAUDE_CODE: '@anthropic-ai/claude-code@2.1.304'
    # The needs above already ran tools/verify-template.sh and the validators.
    EVALS_CHECKS_DONE: '1'
    # One arm by default (half the cost). When starting the job for a release that changes a
    # skill's description or develop's routing, set EVALS_ARGS to "--ablation with-without" to
    # get the no-plugin baseline and its delta.
    EVALS_ARGS: ''
  before_script:
    - corepack enable
    - npm install -g "$CLAUDE_CODE"
  artifacts:
    when: always
    paths:
      - web-dev/evals/results/

evals-routing:
  extends: .evals
  script:
    # Three runs per case. A run scores the share of its graders that pass, and a case the mean of
    # its runs; a case below 0.66 fails the job. Model runs vary, so the bar is not 1.0.
    - cd web-dev
    - bash evals/run.sh --tag routing --runs 3 --threshold 0.66 --max-cost-usd 25 --trust-plugin --no-publish $EVALS_ARGS

evals-e2e:
  extends: .evals
  script:
    # One run each: a whole feature (20) and a whole app (21), the costliest cases.
    - cd web-dev
    - bash evals/run.sh --tag e2e --runs 1 --max-cost-usd 40 --trust-plugin --no-publish $EVALS_ARGS
