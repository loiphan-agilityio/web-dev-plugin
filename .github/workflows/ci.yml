# Checks the web-dev and web-quality plugins on GitHub Actions:
# - manifests: both plugin manifests and the marketplace manifest are valid.
# - skills-spec: every skill passes skills-ref, the Agent Skills specification's validator, and
#   every eval case.yaml parses.
# - verify: tools/verify.sh: the free checks, then the todos feature the skills quote passes every
#   gate, e2e included, in a project created from the boilerplate (cloned from GitHub).
# - plugin-scripts: the tests of web-dev's contract check and web-quality's measurement scripts
#   (local servers, no network).
# Runs on every pull request, on pushes to main that touch the plugin, on release tags, and weekly,
# so a dependency or boilerplate release that breaks what the skills quote shows up before a user
# hits it. A branch is checked through its pull request, so each check runs once. companions.yml
# checks the companion skills. The model evals never run here: they are paid, so they run only on
# the maintainer's machine (tools/run-evals.sh).
name: CI

on:
  push:
    branches: [main]
    tags: ['web-dev--v*', 'web-quality--v*']
    paths:
      - 'web-dev/**'
      - 'web-quality/**'
      - 'tools/**'
      - '.claude-plugin/**'
      - '.github/workflows/ci.yml'
  # Every pull request, with no paths filter: main requires these checks, and GitHub never reports a
  # check whose workflow did not start, so a filtered-out pull request could not be merged.
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  manifests:
    name: 'Validate: plugin manifests'
    runs-on: ubuntu-latest
    env:
      # Pinned like everything else; validation needs no login.
      CLAUDE_CODE: '@anthropic-ai/claude-code@2.1.304'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx -y "$CLAUDE_CODE" plugin validate --strict web-dev/.claude-plugin/plugin.json
      - run: npx -y "$CLAUDE_CODE" plugin validate --strict web-quality/.claude-plugin/plugin.json
      - run: npx -y "$CLAUDE_CODE" plugin validate --strict .

  skills-spec:
    name: 'Validate: skills spec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # The Agent Skills reference validator, pinned like every other tool here.
      - run: pip install --quiet skills-ref==0.1.1 pyyaml==6.0.3
      - run: bash tools/validate-skills.sh

  verify:
    name: 'Test: quoted code in the boilerplate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm 11 comes from each project's packageManager field.
      - run: corepack enable
      # The pinned boilerplate commit (create-project.sh); the weekly run tries the boilerplate's
      # main instead, so a change there that breaks the quoted code shows up before the pin moves.
      - run: bash tools/verify.sh
        env:
          BOILERPLATE_REF: ${{ github.event_name == 'schedule' && 'main' || '' }}

  plugin-scripts:
    name: 'Test: plugin scripts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test web-dev/scripts/test/*.test.mjs web-quality/scripts/test/*.test.mjs
